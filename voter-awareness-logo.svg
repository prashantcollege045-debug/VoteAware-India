<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" width="100%" height="100%" fill="none" role="img" aria-label="VoteAware India Voter Awareness Visual - Ballot Box, Democracy, and Digital Technology">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#F0FDF4" />
    </linearGradient>

    <!-- Box Gradients -->
    <linearGradient id="boxFrontGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="60%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="boxTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803D" />
      <stop offset="50%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Container with Soft Border -->
  <rect x="2" y="2" width="456" height="296" rx="16" fill="url(#bgGrad)" stroke="#CBD5E1" stroke-width="1.5" />

  <!-- Digital Grid & Circuit Traces (Technology Theme) -->
  <g opacity="0.35">
    <!-- Grid Lines -->
    <path d="M 40 40 L 420 40 M 40 80 L 420 80 M 40 220 L 420 220 M 40 260 L 420 260" stroke="#94A3B8" stroke-width="0.75" stroke-dasharray="4 4" />
    <path d="M 80 30 L 80 270 M 160 30 L 160 270 M 300 30 L 300 270 M 380 30 L 380 270" stroke="#94A3B8" stroke-width="0.75" stroke-dasharray="4 4" />

    <!-- Left Circuit Path (Saffron/Blue) -->
    <path d="M 50 140 H 110 L 135 115 H 160" stroke="#EA580C" stroke-width="2" stroke-linecap="round" fill="none" />
    <circle cx="50" cy="140" r="3.5" fill="#EA580C" />
    <circle cx="110" cy="140" r="3" fill="#EA580C" />
    <circle cx="160" cy="115" r="3.5" fill="#EA580C" />

    <path d="M 60 180 H 100 L 125 205 H 155" stroke="#2563EB" stroke-width="2" stroke-linecap="round" fill="none" />
    <circle cx="60" cy="180" r="3" fill="#2563EB" />
    <circle cx="155" cy="205" r="3" fill="#2563EB" />

    <!-- Right Circuit Path (Green/Blue) -->
    <path d="M 410 140 H 350 L 325 115 H 300" stroke="#16A34A" stroke-width="2" stroke-linecap="round" fill="none" />
    <circle cx="410" cy="140" r="3.5" fill="#16A34A" />
    <circle cx="350" cy="140" r="3" fill="#16A34A" />
    <circle cx="300" cy="115" r="3.5" fill="#16A34A" />

    <path d="M 400 180 H 360 L 335 205 H 305" stroke="#2563EB" stroke-width="2" stroke-linecap="round" fill="none" />
    <circle cx="400" cy="180" r="3" fill="#2563EB" />
    <circle cx="305" cy="205" r="3" fill="#2563EB" />
  </g>

  <!-- Democracy Ring (Civic Chakra & Rays in background) -->
  <g transform="translate(230, 132)">
    <!-- Outer Civic Circle -->
    <circle r="88" stroke="#E2E8F0" stroke-width="2.5" fill="none" />
    <circle r="88" stroke="#3B82F6" stroke-width="2.5" stroke-dasharray="14 10" fill="none" opacity="0.6" />

    <!-- 24 Civic Radiating Dots (Democracy Wheel) -->
    <g opacity="0.75">
      <circle cx="0" cy="-78" r="2.5" fill="#EA580C" />
      <circle cx="20" cy="-75" r="2.5" fill="#2563EB" />
      <circle cx="39" cy="-67" r="2.5" fill="#16A34A" />
      <circle cx="55" cy="-55" r="2.5" fill="#EA580C" />
      <circle cx="67" cy="-39" r="2.5" fill="#2563EB" />
      <circle cx="75" cy="-20" r="2.5" fill="#16A34A" />
      <circle cx="78" cy="0" r="2.5" fill="#EA580C" />
      <circle cx="75" cy="20" r="2.5" fill="#2563EB" />
      <circle cx="67" cy="39" r="2.5" fill="#16A34A" />
      <circle cx="55" cy="55" r="2.5" fill="#EA580C" />
      <circle cx="39" cy="67" r="2.5" fill="#2563EB" />
      <circle cx="20" cy="75" r="2.5" fill="#16A34A" />
      <circle cx="0" cy="78" r="2.5" fill="#EA580C" />
      <circle cx="-20" cy="75" r="2.5" fill="#2563EB" />
      <circle cx="-39" cy="67" r="2.5" fill="#16A34A" />
      <circle cx="-55" cy="55" r="2.5" fill="#EA580C" />
      <circle cx="-67" cy="39" r="2.5" fill="#2563EB" />
      <circle cx="-75" cy="20" r="2.5" fill="#16A34A" />
      <circle cx="-78" cy="0" r="2.5" fill="#EA580C" />
      <circle cx="-75" cy="-20" r="2.5" fill="#2563EB" />
      <circle cx="-67" cy="-39" r="2.5" fill="#16A34A" />
      <circle cx="-55" cy="-55" r="2.5" fill="#EA580C" />
      <circle cx="-39" cy="-67" r="2.5" fill="#2563EB" />
      <circle cx="-20" cy="-75" r="2.5" fill="#16A34A" />
    </g>
  </g>

  <!-- Digital Glow beneath the Ballot Box -->
  <ellipse cx="230" cy="204" rx="100" ry="18" fill="#38BDF8" opacity="0.25" filter="url(#softGlow)" />

  <!-- ======================================================================
       BALLOT BOX (Main Central Structure)
       ====================================================================== -->
  <g filter="url(#cardShadow)">
    <!-- Ballot Box Base Body -->
    <rect x="156" y="126" width="148" height="88" rx="8" fill="url(#boxFrontGrad)" stroke="#1E3A8A" stroke-width="1.5" />

    <!-- Subtle Front Panel Inset -->
    <rect x="166" y="142" width="128" height="62" rx="6" fill="#0F172A" opacity="0.5" stroke="#334155" stroke-width="1" />

    <!-- Digital Tech Badge on Ballot Box Front -->
    <g transform="translate(230, 172)">
      <!-- Verified Shield Emblem -->
      <path d="M 0 -16 L 14 -10 V 2 C 14 10 0 17 0 17 C 0 17 -14 10 -14 2 V -10 Z" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" />
      <!-- Small Checked Tick inside shield -->
      <path d="M -5 1 L -1 5 L 6 -3" stroke="#22C55E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <!-- Tech lines left and right of shield -->
      <line x1="-36" y1="2" x2="-20" y2="2" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
      <circle cx="-38" cy="2" r="2" fill="#38BDF8" />
      <line x1="20" y1="2" x2="36" y2="2" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
      <circle cx="38" cy="2" r="2" fill="#38BDF8" />
    </g>

    <!-- Box Top Lid (Angled Perspective) -->
    <polygon points="144,126 166,104 294,104 316,126" fill="url(#boxTopGrad)" stroke="#2563EB" stroke-width="1.5" />

    <!-- Lid Slot Trim (Digital Glowing Slot) -->
    <polygon points="190,116 200,111 260,111 270,116" fill="#0F172A" stroke="#38BDF8" stroke-width="1" />
    <!-- Slot Opening -->
    <ellipse cx="230" cy="113.5" rx="28" ry="2.5" fill="#020617" />
    <!-- Slot Light Glow -->
    <ellipse cx="230" cy="113.5" rx="22" ry="1.5" fill="#38BDF8" opacity="0.75" />
  </g>

  <!-- ======================================================================
       BALLOT PAPER (Entering the Slot - Voting Representation)
       ====================================================================== -->
  <g transform="translate(230, 88)" filter="url(#cardShadow)">
    <!-- Ballot Paper Base -->
    <rect x="-38" y="-52" width="76" height="74" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" />

    <!-- Saffron Header Band on Ballot -->
    <path d="M -38 -48 C -38 -50.2 -36.2 -52 -34 -52 L 34 -52 C 36.2 -52 38 -50.2 38 -48 L 38 -40 L -38 -40 Z" fill="url(#saffronGrad)" />

    <!-- Three voting option rows on ballot -->
    <!-- Row 1 -->
    <rect x="-30" y="-33" width="38" height="5" rx="2" fill="#E2E8F0" />
    <circle cx="24" cy="-30.5" r="4.5" stroke="#94A3B8" stroke-width="1.2" fill="#F8FAFC" />

    <!-- Row 2: Selected Choice with Green Tick -->
    <rect x="-30" y="-19" width="38" height="5" rx="2" fill="#CBD5E1" />
    <circle cx="24" cy="-16.5" r="5" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5" />
    <path d="M 21.5 -16.5 L 23.5 -14 L 27 -18.5" stroke="#15803D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Row 3 -->
    <rect x="-30" y="-5" width="38" height="5" rx="2" fill="#E2E8F0" />
    <circle cx="24" cy="-2.5" r="4.5" stroke="#94A3B8" stroke-width="1.2" fill="#F8FAFC" />

    <!-- Green Bottom Accent Strip on Ballot -->
    <rect x="-38" y="16" width="76" height="6" rx="1" fill="url(#greenGrad)" />
  </g>

  <!-- Subtle Downward Motion Indicator (Arrow showing entry into slot) -->
  <g transform="translate(230, 99)" opacity="0.85">
    <circle cx="0" cy="0" r="10" fill="#2563EB" />
    <path d="M -4 -2 L 0 3 L 4 -2" stroke="#FFFFFF" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- ======================================================================
       TRICOLOR CIVIC ACCENT STRIP (Orange, White, Green)
       ====================================================================== -->
  <g transform="translate(145, 222)">
    <rect x="0" y="0" width="56" height="4" rx="2" fill="url(#saffronGrad)" />
    <rect x="58" y="0" width="54" height="4" rx="2" fill="#0284C7" />
    <rect x="114" y="0" width="56" height="4" rx="2" fill="url(#greenGrad)" />
  </g>

  <!-- ======================================================================
       BOTTOM CIVIC TYPOGRAPHY (VoteAware India Banner)
       ====================================================================== -->
  <g transform="translate(230, 252)" text-anchor="middle">
    <text y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#0F172A" letter-spacing="1.5">
      VOTEAWARE <tspan fill="#EA580C">INDIA</tspan>
    </text>
    <text y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#059669" letter-spacing="0.5">
      DEMOCRACY • VOTING • DIGITAL EMPOWERMENT
    </text>
  </g>
</svg>
